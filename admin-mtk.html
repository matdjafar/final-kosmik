<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Live KOSMIK CBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; }
        .blinking { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
        .row-update { animation: highlight 2s ease-out; }
        @keyframes highlight { 0% { background-color: #d1fae5; } 100% { background-color: white; } }
    </style>
</head>
<body class="text-gray-800">
    <!-- Navbar -->
    <nav class="bg-emerald-700 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="max-w-full mx-auto flex justify-between items-center px-4">
            <div class="flex items-center gap-3">
                <div class="bg-white p-1 rounded"><img src="https://iili.io/CSRcfLB.png" class="h-8"></div>
                <h1 class="font-extrabold text-xl tracking-wide">COMMAND CENTER <span class="text-emerald-300 font-normal">| Live KOSMIK</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="statusPing" class="flex items-center gap-2 text-sm font-bold bg-emerald-800 px-3 py-1.5 rounded-full"><div class="w-3 h-3 bg-red-500 rounded-full" id="pingDot"></div> <span id="pingText">Menghubungkan...</span></span>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="p-6 max-w-full mx-auto space-y-6">
        <!-- Statistik Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-blue-500">
                <p class="text-gray-500 font-bold text-sm">SISWA AKTIF</p>
                <h2 class="text-4xl font-black text-gray-800" id="statActive">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-green-500">
                <p class="text-gray-500 font-bold text-sm">SELESAI UJIAN</p>
                <h2 class="text-4xl font-black text-gray-800" id="statFinish">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-red-500">
                <p class="text-gray-500 font-bold text-sm">PELANGGARAN</p>
                <h2 class="text-4xl font-black text-gray-800" id="statCheat">0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            
            <!-- Tabel Ranking Live -->
            <div class="xl:col-span-1 bg-white rounded-2xl shadow-md overflow-hidden flex flex-col h-[70vh]">
                <div class="bg-gray-800 text-white p-4 font-bold flex justify-between">
                    <span>🏆 Live Ranking</span>
                </div>
                <div class="overflow-y-auto flex-grow p-0">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 sticky top-0">
                            <tr><th class="p-3">Rank</th><th class="p-3">Siswa</th><th class="p-3 text-right">Skor</th></tr>
                        </thead>
                        <tbody id="rankBody" class="divide-y">
                            <tr><td colspan="3" class="p-4 text-center text-gray-500">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tabel Monitoring Real-time -->
            <div class="xl:col-span-3 bg-white rounded-2xl shadow-md overflow-hidden flex flex-col h-[70vh]">
                <div class="bg-emerald-600 text-white p-4 font-bold flex justify-between items-center">
                    <span>📡 Live Input Jawaban Siswa</span>
                    <span class="text-xs bg-emerald-800 px-2 py-1 rounded shadow-inner">Auto-refresh tiap 5 dtk</span>
                </div>
                <div class="overflow-y-auto overflow-x-auto flex-grow p-0">
                    <table class="w-full text-xs text-left whitespace-nowrap">
                        <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="p-3">Nama Siswa</th><th class="p-3">Status</th><th class="p-3 text-center">Skor</th><th class="p-3 text-center text-red-600">Pelanggaran</th>
                                <!-- Generate header soal 1-25 -->
                                <script>for(let i=1;i<=25;i++) document.write(`<th class='p-3 text-center bg-gray-200 border-l border-white w-10'>${i}</th>`);</script>
                            </tr>
                        </thead>
                        <tbody id="monitorBody" class="divide-y">
                            <tr><td colspan="30" class="p-4 text-center text-gray-500">Menunggu sinkronisasi data dari server...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzIEAsbH64Pk-hn8lnGOxOz9cjGdwgbRqUZk0eOhqIr3jL6hiYBHX6AE7J6auV_EXXGMg/exec"; // GANTI DENGAN URL BARU
        
        let previousDataString = "";

        // Fungsi Ambil Data dari Server
        function fetchData() {
            document.getElementById('pingDot').classList.replace('bg-green-500', 'bg-yellow-400');
            document.getElementById('pingDot').classList.add('blinking');
            document.getElementById('pingText').innerText = "Fetching...";

            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: 'get_admin' }) })
            .then(res => res.json())
            .then(data => {
                document.getElementById('pingDot').classList.replace('bg-yellow-400', 'bg-green-500');
                document.getElementById('pingDot').classList.remove('blinking');
                document.getElementById('pingText').innerText = "Connected";
                
                renderDashboard(data);
            })
            .catch(err => {
                document.getElementById('pingDot').classList.replace('bg-yellow-400', 'bg-red-500');
                document.getElementById('pingText').innerText = "Connection Lost";
            });
        }

        // Fungsi Menampilkan Data
        function renderDashboard(data) {
            let currentString = JSON.stringify(data);
            if(currentString === previousDataString) return; // Skip render jika tidak ada yang berubah
            previousDataString = currentString;

            let active = 0, finish = 0, cheats = 0;
            let monitorHtml = '';
            
            // Build Monitor Table
            data.monitoring.forEach(row => {
                if(row.status === "SELESAI") finish++; else active++;
                cheats += parseInt(row.pelanggaran || 0);
                
                let statBadge = '';
                if(row.status === "SELESAI") statBadge = '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded font-bold shadow-sm">SELESAI</span>';
                else if(row.status === "DISKUALIFIKASI") statBadge = '<span class="px-2 py-1 bg-red-600 text-white rounded font-bold shadow-sm">BANNED</span>';
                else if(row.status === "UNBAN") statBadge = '<span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded font-bold shadow-sm">MEMBUKA...</span>';
                else statBadge = '<span class="px-2 py-1 bg-green-100 text-green-700 rounded font-bold blinking shadow-sm">LIVE</span>';

                let cheatClass = row.pelanggaran > 0 ? 'text-red-600 font-bold bg-red-50' : 'text-gray-400';
                
                // Tombol Buka Blokir (Hanya muncul jika ada pelanggaran atau dibanned)
                let unbanBtn = (row.pelanggaran > 0 || row.status === "DISKUALIFIKASI") ? `<button onclick="unbanStudent('${row.nama}')" class="ml-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-[10px] px-2 py-1 rounded shadow-sm font-bold active:scale-95 transition-transform">Buka Blokir</button>` : '';
                
                monitorHtml += `<tr class="hover:bg-gray-50 row-update">
                    <td class="p-3 font-bold text-gray-800 truncate max-w-[150px]" title="${row.nama}">${row.nama}</td>
                    <td class="p-3">${statBadge}</td>
                    <td class="p-3 text-center font-black text-emerald-600 text-base">${row.skor}</td>
                    <td class="p-3 text-center ${cheatClass}">${row.pelanggaran} ${unbanBtn}</td>`;
                
                // Render jawaban 1-25
                row.jawaban.forEach(jwb => {
                    let j = jwb === "-" ? "" : String(jwb).substring(0, 4); // Singkat jawaban yg panjang
                    let bg = j ? 'bg-emerald-50 text-emerald-700 font-bold' : 'text-gray-300';
                    monitorHtml += `<td class="p-3 text-center border-l ${bg}" title="${jwb}">${j}</td>`;
                });
                
                monitorHtml += `</tr>`;
            });
            
            document.getElementById('monitorBody').innerHTML = monitorHtml || '<tr><td colspan="30" class="p-4 text-center">Belum ada peserta yang online.</td></tr>';
            
            // Stats Update
            document.getElementById('statActive').innerText = active;
            document.getElementById('statFinish').innerText = finish;
            document.getElementById('statCheat').innerText = cheats;

            // Build Rank Table
            let rankHtml = '';
            data.ranking.forEach((r, idx) => {
                let icon = idx===0 ? '🥇' : (idx===1 ? '🥈' : (idx===2 ? '🥉' : r.rank));
                let strike = r.status === "DISKUALIFIKASI" ? 'line-through text-red-400' : 'text-gray-800';
                rankHtml += `<tr class="hover:bg-gray-50"><td class="p-3 font-bold text-center">${icon}</td><td class="p-3 font-medium truncate max-w-[120px] ${strike}">${r.nama}</td><td class="p-3 text-right font-black text-emerald-600">${r.skor}</td></tr>`;
            });
            document.getElementById('rankBody').innerHTML = rankHtml || '<tr><td colspan="3" class="p-4 text-center text-gray-500">Belum ada data...</td></tr>';
        }

        // Fungsi Kirim Perintah Buka Blokir / Reset Pelanggaran ke Server
        function unbanStudent(nama) {
            if(!confirm(`Buka blokir / reset pelanggaran untuk siswa: ${nama}?`)) return;
            
            fetch(GAS_URL, { 
                method: "POST", 
                body: JSON.stringify({ action: 'unban_user', name: nama }) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert(`Permintaan buka blokir untuk ${nama} berhasil dikirim.\nMenunggu perangkat siswa merespons otomatis...`);
                    fetchData(); // Refresh tampilan admin
                }
            })
            .catch(err => alert("Gagal menghubungi server. Periksa koneksi internet."));
        }

        // Jalankan Fetch pertama dan interval perulangan setiap 5 detik
        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
